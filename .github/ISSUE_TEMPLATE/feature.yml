name: Feature
description: A feature or change for the backlog
title: "[Feature] "
labels: ["type:feature", "status:idea"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should be built or changed?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem this solves or the value it adds.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable checklist. Each item should be checkable without guessing.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and context
      description: Files, pins, protocol or scope limits, related issues.
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What must NOT be done as part of this issue.
