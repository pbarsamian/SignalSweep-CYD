; SignalSweep CYD — control plane + HMI (split architecture, M2)
; Board: ESP32-2432S028R "Cheap Yellow Display"
; Build from this directory:  python -m platformio run
; The standalone single-board firmware (v3.21 and earlier) lives on the
; `standalone` branch / tag standalone-v3.21; its sources are kept here in
; legacy/ (not built) as porting reference.

[env:cyd]
platform  = espressif32
board     = esp32dev
framework = arduino

board_build.flash_size = 4MB
board_build.partitions = huge_app.csv

extra_scripts = pre:copy_setup_pre.py

; src/ plus the shared contract (C sources compiled into this firmware, never copied)
build_src_filter =
    +<*>
    +<../../shared/*.c>

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -I../shared
    -Iinclude

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

monitor_speed = 115200
upload_speed  = 921600
